<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Numbers List</title>
    <style>
        /* Basic Reset and Styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        header {
            padding: 20px;
            background-color: #2a2a2a;
            border-bottom: 1px solid #333;
        }
        
        h1 {
            text-align: center;
            color: #ffffff;
            margin: 0;
            font-size: 1.5em;
        }

        /* List Styling */
        .number-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .list-item {
            display: flex;
            align-items: center; /* Vertically align items */
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            transition: background-color 0.2s ease;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:hover {
            background-color: #2c2c2c;
        }

        /* Serial Number Styling */
        .serial-number {
            color: #888; /* Dim color for serial number */
            font-weight: bold;
            margin-right: 15px;
            min-width: 30px; /* Ensures alignment for 1-digit and 2-digit numbers */
            text-align: right;
        }
        
        /* Phone Number Text - Unselectable */
        .phone-number {
            font-size: 1.1em;
            letter-spacing: 1px;
            color: #b0b0b0;
            user-select: none; /* Prevents text selection */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            flex-grow: 1; /* Pushes the copy button to the end */
        }

        /* Copy Button Styling */
        .copy-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            outline: none;
            min-width: 80px; /* To prevent size change */
            text-align: center;
            flex-shrink: 0; /* Prevents the button from shrinking */
        }

        .copy-btn:hover {
            background-color: #0056b3;
        }

        .copy-btn:active {
            transform: scale(0.97);
        }

        /* Class added when text is copied */
        .copy-btn.copied {
            background-color: #28a745; /* Green color for success */
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Contact List</h1>
        </header>
        <ul class="number-list">
            <!-- Content will be generated by JavaScript -->
        </ul>
    </div>

    <script>
        // Array of all phone numbers
        const phoneNumbers = [
            "+91 97672 50648", "+91 98234 76269", "+91 98606 20882", "+91 98816 04455",
            "+91 99211 50734", "+91 99217 86747", "+91 99226 47874", "+91 99608 56904",
            "+91 99701 13654", "+91 99755 11373", "+91 99755 13679", "+91 93564 36665",
            "+91 93709 66346", "+91 93730 56631", "+91 93732 56940", "+91 96233 89838",
            "+91 96372 79891", "+91 96995 58007", "+91 97628 68570", "+91 97634 84247",
            "+91 97671 41278", "+91 97672 50646", "+91 90217 84191", "+91 90229 98985",
            "+91 90961 78807", "+91 90961 92492", "+91 91467 39026", "+91 91589 06885",
            "+91 92092 72429", "+91 92096 25270", "+91 93090 24483", "+91 93229 37172",
            "+91 93256 15166", "+91 82373 01738", "+91 93568 76064", "+91 75068 95089",
            "+91 87671 75547", "+91 93704 43877", "+91 70206 62326", "+91 70288 58031",
            "+91 70580 96275", "+91 73788 50625", "+91 74980 47217", "+91 75173 25373",
            "+91 84858 18154", "+91 85911 07803", "+91 86689 76540", "+91 87672 15844",
            "+91 87675 14673", "+91 88300 86220", "+91 88306 05289", "+91 89759 22780",
            "+91 89996 42598", "+91 90112 16389", "+91 90211 70852", "+91 75883 97827",
            "+91 76205 21684", "+91 76207 64336", "+91 77678 30709", "+91 77758 50625",
            "+91 79720 47756", "+91 80103 88762", "+91 80877 61601", "+91 81809 21750",
            "+91 82081 80219", "+91 84548 15589", "+91 84591 21599"
        ];

        // Function to populate the list dynamically
        function populateList() {
            const list = document.querySelector('.number-list');
            list.innerHTML = ''; // Clear existing items

            phoneNumbers.forEach((number, index) => {
                const listItem = document.createElement('li');
                listItem.className = 'list-item';

                // Create and add the serial number span
                const serialSpan = document.createElement('span');
                serialSpan.className = 'serial-number';
                serialSpan.textContent = `${index + 1})`;
                
                // Create the phone number span
                const numberSpan = document.createElement('span');
                numberSpan.className = 'phone-number';
                numberSpan.textContent = number;

                // Create the copy button
                const copyButton = document.createElement('button');
                copyButton.className = 'copy-btn';
                copyButton.textContent = 'Copy';
                copyButton.dataset.number = number.replace(/\s/g, ''); 

                // Add all elements to the list item
                listItem.appendChild(serialSpan);
                listItem.appendChild(numberSpan);
                listItem.appendChild(copyButton);
                list.appendChild(listItem);
            });
        }
        
        // Universal copy function (no changes needed here)
        function copyNumber(buttonElement) {
            const numberToCopy = buttonElement.dataset.number;
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = numberToCopy;
            tempTextArea.style.position = 'absolute';
            tempTextArea.style.left = '-9999px';
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextArea);
            
            const originalText = buttonElement.textContent;
            buttonElement.textContent = 'Copied!';
            buttonElement.classList.add('copied');
            
            setTimeout(() => {
                buttonElement.textContent = originalText;
                buttonElement.classList.remove('copied');
            }, 2000);
        }

        // Add event listener to the list container
        document.querySelector('.number-list').addEventListener('click', function(event) {
            if (event.target && event.target.classList.contains('copy-btn')) {
                copyNumber(event.target);
            }
        });

        // Populate the list when the page loads
        document.addEventListener('DOMContentLoaded', populateList);
    </script>

</body>
</html>
